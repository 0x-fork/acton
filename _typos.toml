[files]
extend-exclude = [
  "*.csv",
  "apps/localton/tests/snapshots/**",
  "block.tlb",
  "crates/acton-abi-catalog/data/data-abis.json",
  "crates/tasm-core/spec/**",
  "crates/tolk-compiler/assets/**",
  "crates/ton-indexer-liteserver/fixtures/mainnet-global.config.json",
  "crates/ton-liteapi/src/tl/schemas/**",
  "crates/ton-state/src/storage-decoder.js",
  "dist-workspace.toml",
  "docs/.next/**",
  "docs/.source/**",
  "docs/bun.lock",
  "docs/grammars/**",
  "docs/node_modules/**",
  "docs/out/**",
  "docs/public/resources/**",
  "docs/src/lib/og/**",
  "packages/address-registry/src/jettons.json",
  "packages/address-registry/src/mainnet.json",
  "packages/address-registry/src/testnet.json",
  "packages/explorer-core/src/cell-inspector/block.tlb.generated.ts",
  "src/commands/new/templates/*/app/**",
  "src/commands/new/templates/*/package-lock.json",
  "src/commands/new/templates/*/wrappers-ts/**",
  "src/ffi/testdata/**",
  "tests/**/snapshots/**",
]

[default]
extend-ignore-re = [
  "\\b[a-zA-Z0-9_+/\\-]{48,}\\b", # user-friendly addresses
  "\\bADDD\\b",
  "\\bTrUe\\b",
  "\\balse\\b",
  "\\b(?:test-)?ba-stdlib-[A-Za-z0-9-]+\\b",
  "[dD]arcula",
  "BA",
  "Ba",
  "Inferrable",
  "readed",
  "authentificate",
  "authentification",
  "ba",
  "lazer",
  "\\b(?:vart|fo|FO|Fo|tou|overfl|bui|tru|TNam)\\b", # completion prefixes
  "\\b(?:CapDelections|CapGroth16|Groth16|entires|ded_)\\b", # rston identifiers and hex fixtures
]
