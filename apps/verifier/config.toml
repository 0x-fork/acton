[server]
bind_addr = "127.0.0.1:3000"

[network]
name = "mainnet"

[toncenter]

[registry]
register_value_nano = 500000000
confirmation_attempts = 20
confirmation_delay_ms = 1000

[wallet]
kind = "v5r1"
workchain = 0

[source_repository]
remote = "origin"
author_name = "ton-verifier"
author_email = "ton-verifier@example.invalid"

[compiler]
node_bin = "node"
worker_path = "compiler-worker/compile.mjs"
timeout_ms = 5000
