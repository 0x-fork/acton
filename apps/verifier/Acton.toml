[package]
name = "verifier-contracts"
description = "TON code-hash verification registry contracts"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.1.0"

[contracts.VerificationRecord]
display-name = "VerificationRecord"
src = "contracts/VerificationRecord.tolk"
depends = []

[contracts.RegistryMaster]
display-name = "RegistryMaster"
src = "contracts/RegistryMaster.tolk"
depends = ["VerificationRecord"]

[localnet]
port = 5412
accounts = ["deployer"]

[test]

[fmt]
width = 100
ignore = []

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"
