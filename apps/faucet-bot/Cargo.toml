[package]
name = "faucet-bot"
description = "TON faucet bot"
version = { workspace = true }
default-run = "faucet-bot"
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[workspace]

[workspace.package]
version = "0.1.0"
authors = ["TON Core"]
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/ton-blockchain/acton"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

assigning_clones = "deny"
doc_markdown = "deny"
elidable_lifetime_names = "deny"
format_push_string = "deny"
manual_let_else = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
multiple_crate_versions = "allow"
must_use_candidate = "deny"
needless_raw_string_hashes = "deny"
redundant_closure_for_method_calls = "deny"
ref_option = "deny"
return_self_not_must_use = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
cognitive_complexity = "allow"
too_many_lines = "allow"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "macros", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
