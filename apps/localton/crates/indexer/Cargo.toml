[package]
name = "localton-indexer"
description = "Embedded network metrics indexer for Localton"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["sync", "time"] }
ton-indexer-core = { path = "../../../../crates/ton-indexer-core" }
ton-indexer-liteserver = { path = "../../../../crates/ton-indexer-liteserver" }
tracing = "0.1"

[dev-dependencies]
expect-test = "1.5.0"
tempfile = "3.20"

[lib]
doctest = false
