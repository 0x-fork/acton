name: Build Docker Image
description: Build and push a Docker image to GitHub Container Registry.

inputs:
  ref_name:
    description: Branch or tag name used for the image tag.
    required: true
  image_file:
    description: Dockerfile path.
    required: false
    default: './Dockerfile'
  component:
    description: Optional component suffix for the image repository.
    required: false
    default: ''
  github_token:
    description: GitHub token used for GHCR login and Docker metadata.
    required: true

outputs:
  image_repo:
    description: Full GHCR image repository.
    value: ${{ steps.params.outputs.image_repo }}
  image_tag:
    description: Main image tag.
    value: ${{ steps.params.outputs.tag }}
  image_digest:
    description: Pushed image digest.
    value: ${{ steps.build.outputs.digest }}
  image_revision:
    description: Git revision used for the image.
    value: ${{ steps.revision.outputs.revision }}
  component:
    description: Component name.
    value: ${{ steps.params.outputs.component }}

runs:
  using: composite
  steps:
    - name: Compute params
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      id: params
      env:
        REF_NAME: ${{ inputs.ref_name }}
        COMPONENT: ${{ inputs.component }}
      with:
        # language=JavaScript
        script: |
          const tag = process.env.REF_NAME === 'master' ? 'main' : process.env.REF_NAME;
          core.setOutput('tag', tag);
          core.setOutput('component', process.env.COMPONENT);
          let repository = process.env.GITHUB_REPOSITORY.toLowerCase();
          if (process.env.COMPONENT) {
            repository += '/' + process.env.COMPONENT
          }
          core.setOutput('repository', repository);
          core.setOutput('image_repo', `ghcr.io/${repository}`);

    - name: Resolve revision
      id: revision
      shell: bash
      run: |
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
      with:
        images: ${{ steps.params.outputs.image_repo }}
        github-token: ${{ inputs.github_token }}
        context: 'git'
        tags: |
          type=sha
          type=sha,format=long
          type=raw,value=${{ steps.params.outputs.tag }}

    - name: Build and push Docker image
      uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      id: build
      with:
        context: .
        file: ${{ inputs.image_file }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
