name: Docker build

on:
  workflow_call:
    inputs:
      ref_name:
        required: true
        type: string
      image_file:
        required: false
        default: './Dockerfile'
        type: string
      component:
        required: false
        type: string
    outputs:
      image_repo:
        value: ${{ jobs.build.outputs.image_repo }}
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        value: ${{ jobs.build.outputs.image_digest }}
      image_revision:
        value: ${{ jobs.build.outputs.image_revision }}
      component:
        value: ${{ jobs.build.outputs.component }}


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    env:
      REF_NAME: ${{ inputs.ref_name || github.ref_name }}

    outputs:
      image_repo: ghcr.io/${{ steps.params.outputs.repository }}
      image_tag: ${{ steps.params.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_revision: ${{ steps.revision.outputs.revision }}
      component: ${{ steps.params.outputs.component }}

    steps:
      - name: Compute params
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        id: params
        env:
          COMPONENT: ${{ inputs.component }}
        with:
          # language=JavaScript
          script: |
            const tag = process.env.REF_NAME === 'master' ? 'main' : process.env.REF_NAME;
            core.setOutput('tag', tag);
            core.setOutput('component', process.env.COMPONENT);
            let repository = process.env.GITHUB_REPOSITORY.toLowerCase();
            if (process.env.COMPONENT) {
              repository += '/' + process.env.COMPONENT
            }
            core.setOutput('repository', repository);

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.REF_NAME }}

      - name: Resolve revision
        id: revision
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ steps.params.outputs.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: 'git'
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=${{ steps.params.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        id: build
        with:
          context: .
          file: ${{ inputs.image_file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
