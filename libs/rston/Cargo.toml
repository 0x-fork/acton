[package]
name = "rston"
description = "TON cells, BoC encoding, dictionaries, Merkle proofs, and blockchain models."
authors = ["Ivan Kalinin <i.kalinin@dexpa.io>"]
repository = "https://github.com/ton-blockchain/acton"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
readme = "README.md"
documentation = "https://docs.rs/rston"
keywords = ["ton", "blockchain", "cell", "boc", "wallet"]
categories = ["data-structures", "encoding", "cryptography"]
publish = ["crates-io"]
include = [
    "src/**",
    "resources/**",
    "tests/**",
    "benches/**",
    "LICENSE-*",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
]
license = "MIT OR Apache-2.0"

[[bench]]
name = "boc"
harness = false

[[bench]]
name = "mine"
harness = false

[[bench]]
name = "dict_from_slice"
harness = false

[[bench]]
name = "dict_modify"
harness = false

[[bench]]
name = "dict_modify_aug"
harness = false

[[bench]]
name = "dict"
harness = false

[[bench]]
name = "slice_uniform"
harness = false

[[bench]]
name = "usage_cell"
harness = false

# callgrind benchmarks

[[bench]]
name = "callgrind_boc"
harness = false

[[bench]]
name = "callgrind_dict_from_slice"
harness = false

[[bench]]
name = "callgrind_dict"
harness = false

[[bench]]
name = "callgrind_slice_uniform"
harness = false

[[bench]]
name = "callgrind_usage_cell"
harness = false

[[bench]]
name = "big_cell"
harness = false

[workspace]
members = ["proc", "fuzz"]

[dependencies]
ahash = "0.8.11"
aes = { version = "0.8", optional = true }
ctr = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
pin-project = { version = "1.1", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync"], optional = true }
tokio-tower = { version = "0.6", optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
tower = { version = "0.5", features = ["make", "util"], optional = true }
arbitrary = { version = "1", features = ["derive"], optional = true }
base64 = { version = "0.22", optional = true }
bip39 = { version = "2.2", features = ["zeroize"] }
bitflags = "2.3"
crc32c = "0.6.8"
dashmap = { version = "6.1.0", optional = true }
ed25519-dalek = "2.2.0"
hex = "0.4"
hmac = "0.12"
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
pbkdf2 = { version = "0.12", features = ["simple"] }
rand8 = { package = "rand", version = "0.8", optional = true }
rand9 = { package = "rand", version = "0.9", optional = true }
rayon = { version = "1.10", optional = true }
scc = { version = "3.8.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10"
smallvec = { version = "1.9", features = ["union"] }
thiserror = "2.0"
tl-proto = { version = "0.5.3", optional = true }
tycho-crypto = { version = "0.4", features = ["tl-proto"], optional = true }
zeroize = "1"

rston-proc = { version = "=0.5.0", path = "proc" }

[dev-dependencies]
tl-scheme = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
anyhow = "1.0"
base64 = "0.22"
criterion = "0.7"
expect-test = "1.5.0"
rand_xorshift = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
iai-callgrind = "0.16.1"
paste = "1.0.15"

rston = { path = "./", features = ["rand9"] }

[features]
default = ["base64", "serde", "models", "sync", "wallet"]
sync = ["dep:scc"]
serde = ["dep:serde", "dep:serde_json", "base64"]
rand8 = ["dep:rand8"]
rand9 = ["dep:rand9"]
tl = ["dep:tl-proto", "dep:tycho-crypto", "dep:rand8"]
adnl = ["tl", "dep:aes", "dep:ctr", "dep:futures", "dep:pin-project", "dep:log", "dep:tokio", "dep:tokio-util", "tycho-crypto/serde"]
liteclient = ["adnl", "models", "serde", "dep:tower", "dep:tokio-tower"]
models = ["dep:tycho-crypto", "dep:tl-proto", "bigint"]
wallet = ["models", "base64", "sync"]
rayon = ["sync", "dep:rayon", "dep:dashmap"]
arbitrary = ["dep:arbitrary"]
bigint = ["dep:num-bigint", "dep:num-traits"]

[profile.release]
debug = true

[profile.dev.package.hex]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
[profile.dev.package.rand]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.tycho-crypto]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package."*"]
opt-level = 1

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
expect_used = "deny"
