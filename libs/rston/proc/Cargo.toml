[package]
name = "rston-proc"
description = "Proc-macro helpers for rston"
authors = ["Ivan Kalinin <i.kalinin@dexpa.io>"]
repository = "https://github.com/ton-blockchain/acton"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
readme = "README.md"
documentation = "https://docs.rs/rston-proc"
keywords = ["ton", "tlb", "derive", "serialization"]
categories = ["encoding", "development-tools::procedural-macro-helpers"]
publish = ["crates-io"]
include = ["src/**/*.rs", "LICENSE-*", "README.md"]
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true
test = false
doctest = false

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0.87", features = ["visit", "full"] }
